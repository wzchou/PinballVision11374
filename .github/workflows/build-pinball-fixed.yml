name: Build PinballVision11374 APK - Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          text = Path('.github/workflows/build-pinball.yml').read_text()

          m = re.search(
              r"cat > /tmp/pinball\.b64 <<'EOF'\n(.*?)\n\s*EOF",
              text,
              re.S
          )

          if not m:
              raise SystemExit("Cannot find embedded project")

          b64 = ''.join(
              line.strip()
              for line in m.group(1).splitlines()
          )

          Path('/tmp/pinball.zip').write_bytes(
              base64.b64decode(b64)
          )
          PY

          unzip -q /tmp/pinball.zip -d /tmp/project

          shopt -s dotglob
          mv /tmp/project/PinballVisionMVP/* .

      - name: Fix AnimatedVisibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              'app/src/main/java/com/example/pinballvision/MainActivity.kt'
          )

          s = p.read_text()

          s2, n = re.subn(
              r'AnimatedVisibility\s*\(\s*visible\s*=\s*([^\n,)]+)\s*\)\s*\{',
              r'if (\1) {',
              s
          )

          print("Fixed", n, "AnimatedVisibility calls")

          if n == 0:
              raise SystemExit(
                  "AnimatedVisibility pattern not found"
              )

          p.write_text(s2)
          PY

      - name: Configure AndroidX
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinballVision11374-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
